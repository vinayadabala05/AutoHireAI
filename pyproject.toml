[tool.poetry]
name = "autohire-ai"
version = "0.1.0"
description = "Autonomous AI career platform — job discovery, resume intelligence, cover letters, browser automation, and multi-agent orchestration."
authors = ["AutoHire AI"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
email-validator = "^2.2.0"
sqlalchemy = "^2.0.36"
alembic = "^1.13.3"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
redis = "^5.2.0"
loguru = "^0.7.2"
python-dotenv = "^1.0.1"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
pyyaml = "^6.0.2"
httpx = "^0.27.2"
playwright = "^1.48.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.1"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------
# Tooling configuration
# --------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "^/\\.venv/"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "deployment", "tests"]
skip = [".venv"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008", # FastAPI's Depends() in function defaults is idiomatic
]

[tool.ruff.lint.isort]
known-first-party = ["app", "deployment", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_decorators = false
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"