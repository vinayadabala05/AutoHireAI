services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autohire-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./logs:/srv/app/logs
      - ./data:/srv/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - autohire-network

  postgres:
    image: postgres:16-alpine
    container_name: autohire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autohire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autohire}
      POSTGRES_DB: ${POSTGRES_DB:-autohire_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autohire}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - autohire-network

  redis:
    image: redis:7-alpine
    container_name: autohire-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - autohire-network

networks:
  autohire-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
